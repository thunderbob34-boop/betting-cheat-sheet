<style>
/*
  Page contract: see templates/CONTRACT.md. This file owns ALL styling, layout,
  the tab bar, the app-install tags, and the tab-switching script. src/build.py
  only ever emits the plain fragment HTML documented there and string-replaces
  it into the seven placeholder tokens below — it never emits style= (except
  the stop-loss fill width) or <script>.
*/

/* ---------- design tokens ---------- */
:root {
  color-scheme: dark;
  --bg: #0b0f14;
  --bg-translucent: rgba(11, 15, 20, 0.86);
  --bg-elevated: #131922;
  --bg-elevated-2: #1a212c;
  --border: #262f3b;
  --border-soft: #1c232d;
  --text: #eef1f5;
  --text-dim: #a7b0bc;
  --text-faint: #7c8794;

  --accent: #4da3ff;
  --accent-soft: #14304d;

  --positive: #3ddc84;
  --positive-bg: #0f2a1c;
  --negative: #ff6b6b;
  --negative-bg: #331414;
  --slate: #97a3b0;
  --slate-bg: #1c222b;

  --tier-easy: #3ddc84;
  --tier-easy-bg: #10281c;
  --tier-easy-border: #1c4530;
  --tier-fun: #b399fa;
  --tier-fun-bg: #221a38;
  --tier-fun-border: #392a5c;
  --tier-lottery: #f0bf5d;
  --tier-lottery-bg: #241c0f;
  --tier-lottery-border: #3d3018;

  --won: #3ddc84;
  --won-bg: #0f2a1c;
  --lost: #ff6b6b;
  --lost-bg: #331414;
  --open: #4da3ff;
  --open-bg: #12253a;
  --pushvoid: #97a3b0;
  --pushvoid-bg: #1c222b;

  --tabbar-h: 60px;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f6f5f0;
    --bg-translucent: rgba(246, 245, 240, 0.86);
    --bg-elevated: #ffffff;
    --bg-elevated-2: #eeece3;
    --border: #e1ddd1;
    --border-soft: #eae7dc;
    --text: #1b1f24;
    --text-dim: #4b5563;
    --text-faint: #6b7280;

    --accent: #2f6fe0;
    --accent-soft: #e4edfd;

    --positive: #1f9d63;
    --positive-bg: #e4f6ec;
    --negative: #d6483f;
    --negative-bg: #fbe9e7;
    --slate: #5b6472;
    --slate-bg: #eceef1;

    --tier-easy: #178a56;
    --tier-easy-bg: #e2f5ea;
    --tier-easy-border: #bfe6d0;
    --tier-fun: #6f4fd1;
    --tier-fun-bg: #efe9fc;
    --tier-fun-border: #d8cbf4;
    --tier-lottery: #a2740f;
    --tier-lottery-bg: #faf0d8;
    --tier-lottery-border: #efdba8;

    --won: #1f9d63;
    --won-bg: #e4f6ec;
    --lost: #d6483f;
    --lost-bg: #fbe9e7;
    --open: #2f6fe0;
    --open-bg: #e4edfd;
    --pushvoid: #5b6472;
    --pushvoid-bg: #eceef1;
  }
}

/* ---------- reset + base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
}
h1, h2, h3 { font-weight: 800; color: var(--text); margin: 0; }
h2 { font-size: 1.02rem; }
h3 { font-size: 0.92rem; }
p { margin: 0; }
a { color: var(--accent); }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; }

a:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-translucent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border-soft);
  padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
}
.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand {
  font-size: 1.08rem;
  letter-spacing: -0.01em;
}
.refresh-btn {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-dim);
  -webkit-tap-highlight-color: transparent;
}
.refresh-btn:active { background: var(--bg-elevated-2); color: var(--accent); }
.topbar-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  margin: 5px 0 0;
  font-size: 0.78rem;
  color: var(--text-faint);
}
.topbar-meta .next::before { content: "\00b7"; margin: 0 6px; color: var(--border); }

/* ---------- sample banner ---------- */
.sample-banner {
  margin: 10px calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--tier-lottery-bg);
  border: 1px solid var(--tier-lottery-border);
  color: var(--tier-lottery);
  font-size: 0.78rem;
  font-weight: 700;
  text-align: center;
}

/* ---------- panels + tab switching ---------- */
main.panels {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  padding: 14px calc(16px + env(safe-area-inset-right)) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px) calc(16px + env(safe-area-inset-left));
}
.panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
/* Progressive enhancement: with no JS, html never gets the "js" class below,
   so every panel stays in normal flow — all four stacked, no jank. */
html.js .panel { display: none; }
html.js .panel.is-active { display: flex; flex: 1 1 auto; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding: 0 max(4px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left));
  background: var(--bg-translucent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border-soft);
}
.tab-link {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  padding: 8px 2px 6px;
  color: var(--text-faint);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.tab-icon { display: block; }
.tab-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.01em; }
.tab-link[aria-current="page"] { color: var(--accent); }

/* ---------- shared: slot header ---------- */
.slot-title { font-size: 1.15rem; margin: 0 0 2px; }
.slot-sub { font-size: 0.85rem; color: var(--text-faint); }

/* ---------- shared: budget ---------- */
.budget {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}
.budget-amount { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-right: 6px; }
.budget-label { font-size: 0.82rem; color: var(--text-dim); }
.budget-why { font-size: 0.8rem; color: var(--text-faint); margin: 6px 0 0; }

/* ---------- shared: result badge ---------- */
.result-badge {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 3px 9px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.result-badge.won { color: var(--won); background: var(--won-bg); }
.result-badge.lost { color: var(--lost); background: var(--lost-bg); }
.result-badge.push, .result-badge.void { color: var(--pushvoid); background: var(--pushvoid-bg); }
.result-badge.open { color: var(--open); background: var(--open-bg); }

/* ---------- shared: money / edge ---------- */
.money, .edge { font-variant-numeric: tabular-nums; font-weight: 700; }
.money.positive, .edge.positive { color: var(--positive); }
.money.negative, .edge.negative { color: var(--negative); }

/* ---------- shared: empty state ---------- */
/* Top-aligned card, not vertically centered: on off-days Today shows this
   followed by the latest results, and centering left a big dead gap between
   the header and the message with the results pinned to the bottom. */
.empty-state {
  text-align: center;
  padding: 26px 16px;
  margin: 4px 0 2px;
  background: var(--bg-elevated);
  border: 1px dashed var(--border);
  border-radius: 14px;
}
.empty-title { font-size: 1.05rem; font-weight: 800; margin: 0 0 6px; }
.empty-sub { font-size: 0.88rem; color: var(--text-faint); }

/* ---------- bet card ---------- */
.bet {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 14px;
  padding: 14px 16px;
}
.bet.tier-easy { border-left-color: var(--tier-easy); }
.bet.tier-fun { border-left-color: var(--tier-fun); }
.bet.tier-lottery {
  border-style: dashed;
  border-left-width: 3px;
  border-color: var(--tier-lottery-border);
  border-left-color: var(--tier-lottery);
}

.bet-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.tier-badge {
  display: inline-flex;
  align-items: center;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--bg-elevated-2);
  color: var(--text-dim);
  border: 1px solid var(--border-soft);
}
.tier-easy .tier-badge { color: var(--tier-easy); background: var(--tier-easy-bg); border-color: var(--tier-easy-border); }
.tier-fun .tier-badge { color: var(--tier-fun); background: var(--tier-fun-bg); border-color: var(--tier-fun-border); }
.tier-lottery .tier-badge { color: var(--tier-lottery); background: transparent; border: 1px dashed var(--tier-lottery-border); }

.bet-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 10px;
  margin-bottom: 6px;
}
.bet-title { font-size: 1rem; font-weight: 700; flex: 1 1 auto; min-width: 0; }
.bet-head .odds { font-size: 1.08rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

.bet-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  color: var(--text-dim);
  font-size: 0.85rem;
  margin: 0 0 10px;
}
.bet-meta > span { display: inline-flex; align-items: baseline; }
.bet-meta > span:not(:first-child)::before { content: "\00b7"; margin: 0 7px; color: var(--text-faint); }
.bet-meta .stake { font-weight: 800; color: var(--text); font-size: 1rem; font-variant-numeric: tabular-nums; }

.prob-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.prob {
  display: flex;
  align-items: baseline;
  gap: 5px;
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 0.82rem;
}
.prob .k { color: var(--text-faint); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
.prob b { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.prob-row.lottery-odds .prob { background: var(--tier-lottery-bg); border-color: var(--tier-lottery-border); }
.prob-row.lottery-odds .one-in-x { background: transparent; border-style: dashed; }
.prob-row.lottery-odds .one-in-x b { color: var(--tier-lottery); font-size: 0.98rem; }

.leg-list { display: flex; flex-direction: column; gap: 4px; margin: 0 0 10px; }
.leg-list li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  background: var(--bg-elevated-2);
  border-radius: 7px;
  padding: 6px 9px;
  font-size: 0.85rem;
}
.leg-list .leg-sel { font-weight: 600; min-width: 0; }
.leg-list .leg-prob { flex: 0 0 auto; color: var(--text-faint); font-variant-numeric: tabular-nums; }

/* historical_import cards: numbers were reconstructed after the fact, not
   researched before the bet — say so where the numbers are shown. */
.reconstructed-tag {
  align-self: center;
  font-size: 0.66rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  border: 1px dashed var(--border);
  border-radius: 999px;
  padding: 3px 8px;
}
.leg-list .leg-prob.reconstructed { font-style: italic; }
.leg-list .leg-prob.reconstructed::after { content: " est."; font-size: 0.72em; }

.reason-summary { font-weight: 600; font-size: 0.92rem; }

.reason-detail { margin-top: 6px; }
.reason-detail summary {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 4px 2px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
  cursor: pointer;
  list-style: none;
}
.reason-detail summary::-webkit-details-marker { display: none; }
.reason-detail summary::after {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
  margin-left: 1px;
  transition: transform 0.15s ease;
}
.reason-detail[open] summary::after { transform: rotate(45deg); }
.reason-detail .reason { font-size: 0.85rem; color: var(--text-dim); margin: 4px 0 8px; }
.reason-detail .prob-source { font-size: 0.78rem; color: var(--text-faint); margin: 0 0 6px; }
.reason-detail .verify {
  font-size: 0.76rem;
  color: var(--text-faint);
  border-top: 1px dashed var(--border-soft);
  padding-top: 6px;
  margin: 6px 0 0;
}

/* ---------- collapsibles: angles / avoid / boosts ---------- */
.more {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.more summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 44px;
  padding: 12px 14px;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.more summary::-webkit-details-marker { display: none; }
.more summary::after {
  content: "";
  flex: 0 0 auto;
  width: 9px;
  height: 9px;
  border-right: 2px solid var(--text-faint);
  border-bottom: 2px solid var(--text-faint);
  transform: rotate(-45deg);
  transition: transform 0.15s ease;
}
.more[open] summary::after { transform: rotate(45deg); }
.more[open] summary { border-bottom: 1px solid var(--border-soft); }
.more > *:not(summary) { margin: 10px 14px; }
.more > *:not(summary):last-child { margin-bottom: 14px; }
.more ul { padding-left: 1.2em; list-style: disc; }
.more li { margin-bottom: 6px; font-size: 0.88rem; color: var(--text-dim); }
.more li:last-child { margin-bottom: 0; }

.avoid-item, .boost-item {
  border-left: 3px solid var(--slate);
  background: var(--bg-elevated-2);
  border-radius: 8px;
  padding: 8px 10px;
}
.avoid-item { border-left-color: var(--negative); background: var(--negative-bg); }
.avoid-sel { font-weight: 700; margin: 0 0 2px; }
.avoid-why { font-size: 0.82rem; color: var(--text-dim); }

.boost-item.fits { border-left-color: var(--positive); background: var(--positive-bg); }
.boost-verdict { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); margin: 0 0 2px; }
.boost-item.fits .boost-verdict { color: var(--positive); }
.boost-desc { font-size: 0.83rem; color: var(--text-dim); }

/* ---------- weekend panel ---------- */
.stoploss { display: flex; flex-direction: column; gap: 6px; }
.stoploss-bar { height: 10px; border-radius: 999px; background: var(--bg-elevated-2); border: 1px solid var(--border-soft); overflow: hidden; }
.stoploss-used { height: 100%; background: linear-gradient(90deg, var(--positive), var(--tier-lottery) 65%, var(--negative)); }
.stoploss-text { font-size: 0.82rem; color: var(--text-dim); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.stat .label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 4px; }
.stat .value { font-size: 1.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .value.positive { color: var(--positive); }
.stat .value.negative { color: var(--negative); }

.slot-row { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.slot-row-head { display: flex; align-items: center; gap: 8px; }
.slot-name { font-weight: 800; }
.slot-date { color: var(--text-faint); font-size: 0.82rem; }
.slot-status {
  margin-left: auto;
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-elevated-2);
  color: var(--text-dim);
  border: 1px solid var(--border-soft);
  white-space: nowrap;
}
.slot-row.published .slot-status { color: var(--open); background: var(--open-bg); border-color: transparent; }
.slot-row.graded .slot-status { color: var(--text-dim); }
.slot-row.skipped, .slot-row.future { opacity: 0.72; }

.slot-bets { margin: 8px 0 0; }
.slot-bet {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: 0.85rem;
}
.slot-bet:last-child { border-bottom: none; padding-bottom: 0; }
.slot-bet:first-child { padding-top: 0; }
.slot-bet-tier {
  flex: 0 0 auto;
  font-size: 0.66rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-faint);
  background: var(--bg-elevated-2);
  border-radius: 5px;
  padding: 2px 6px;
}
.slot-bet-sel { flex: 1 1 150px; min-width: 0; font-weight: 600; }
.slot-bet-line { flex: 0 0 auto; color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 0.8rem; }

/* ---------- legs panel ---------- */
.leg-group { display: flex; flex-direction: column; gap: 8px; }
.leg-group-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-soft);
}
.leg-group-title .kickoff { font-size: 0.78rem; font-weight: 500; color: var(--text-faint); white-space: nowrap; }

.leg { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.leg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.leg-head .leg-sel { font-weight: 700; min-width: 0; }
.leg-head .odds { flex: 0 0 auto; font-weight: 800; font-variant-numeric: tabular-nums; }

.leg-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 0.82rem; }
.leg-meta .market {
  text-transform: uppercase;
  font-size: 0.66rem;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: 2px 6px;
}
.leg-meta .prop-tag { font-size: 0.72rem; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; }
.leg-meta .prob { padding: 2px 8px; font-size: 0.78rem; }
.leg-meta .prob .k { font-size: 0.66rem; }
.leg-meta .edge { font-size: 0.82rem; }
.leg-reason { font-size: 0.83rem; color: var(--text-dim); }
.leg-game { font-size: 0.78rem; color: var(--text-faint); margin: -2px 0 5px; }
.leg-meta .book-tag,
.leg-meta .source-tag { font-size: 0.72rem; border-radius: 6px; padding: 2px 8px; background: var(--bg-elevated-2); color: var(--text-dim); border: 1px solid var(--border-soft); }
.leg-meta .source-tag { font-style: italic; }
.best-value { margin-bottom: 14px; }
.leg-filter { display: none; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.js .leg-filter { display: flex; }
.leg-chip {
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 11px;
  cursor: pointer;
}
.leg-chip.is-on { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.by-game.is-empty, .by-game .leg.is-hidden { display: none; }

/* ---------- lineup panel ---------- */
.fx-league { margin-bottom: 18px; }
.fx-league h3 { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
.fx-team-name { font-size: 0.8rem; font-weight: 500; color: var(--text-faint); }
.fx-total { font-size: 0.85rem; color: var(--text-dim); margin: 8px 0; }
.fx-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.fx-row { display: flex; align-items: center; gap: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.fx-row.empty { border-style: dashed; }
.fx-slot { flex: 0 0 38px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; color: var(--accent); }
.fx-name { flex: 1 1 auto; min-width: 0; font-weight: 700; }
.fx-team { font-size: 0.75rem; font-weight: 500; color: var(--text-faint); }
.fx-src { display: block; font-size: 0.72rem; font-weight: 500; color: var(--text-faint); }
.fx-pts { flex: 0 0 auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.fx-chip { display: inline-block; margin-left: 6px; font-size: 0.66rem; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--bg-elevated-2); color: var(--text-dim); }
.fx-chip.warn { background: var(--accent-soft); color: var(--negative); }
.fx-notes { margin: 0 0 10px; padding-left: 18px; font-size: 0.83rem; color: var(--text-dim); }
.fx-error { font-size: 0.85rem; color: var(--negative); }
.fx-changes { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.fx-changes-title { font-weight: 800; font-size: 0.85rem; }
.fx-changes ul { margin: 6px 0 0; padding-left: 18px; font-weight: 600; font-size: 0.9rem; }

/* ---------- record panel ---------- */
.alltime-line {
  font-size: 0.85rem;
  color: var(--text-dim);
  background: var(--bg-elevated-2);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 10px 12px;
}
.card-record, .last-weekend { display: flex; flex-direction: column; gap: 8px; }
.card-record-note { font-size: 0.82rem; color: var(--text-faint); }
.record-note { font-size: 0.8rem; color: var(--text-faint); font-style: italic; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Cheat Sheet</h1>
    <button type="button" class="refresh-btn" onclick="location.reload()" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.66-5.66L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.66 5.66L4 16"/><path d="M4 20v-4h4"/></svg>
    </button>
  </div>
  <p class="topbar-meta"><span class="updated">{{UPDATED_AT}}</span><span class="next">{{NEXT_UPDATE}}</span></p>
</header>

{{SAMPLE_BANNER}}

<main class="panels">
  <!-- ids are panel-*, NOT the bare tab names: if an element's id matched the
       #today/#weekend/... hash, the browser would anchor-jump to it on launch
       (start_url ends in #today) and slide the top of the card under the
       sticky header. No element matches the hash, so there's nothing to jump to. -->
  <section class="panel is-active" id="panel-today">{{TODAY}}</section>
  <section class="panel" id="panel-weekend">{{WEEKEND}}</section>
  <section class="panel" id="panel-legs">{{LEGS}}</section>
  <section class="panel" id="panel-record">{{RECORD}}</section>
  <section class="panel" id="panel-lineup">{{LINEUP}}</section>
</main>

<nav class="tabbar" aria-label="Sections">
  <a href="#today" class="tab-link" data-tab="today" aria-current="page">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><circle cx="12" cy="12" r="3.6"/></svg>
    <span class="tab-label">Today</span>
  </a>
  <a href="#weekend" class="tab-link" data-tab="weekend">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.75h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="tab-label">Weekend</span>
  </a>
  <a href="#legs" class="tab-link" data-tab="legs">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 3.75 8.25 12 13l8.25-4.75Z"/><path d="M3.75 12 12 16.75 20.25 12"/><path d="M3.75 15.75 12 20.5l8.25-4.75"/></svg>
    <span class="tab-label">Legs</span>
  </a>
  <a href="#record" class="tab-link" data-tab="record">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 20V11M9.5 20V4.5M14.5 20v-8M19.5 20v-5"/></svg>
    <span class="tab-label">Record</span>
  </a>
  <a href="#lineup" class="tab-link" data-tab="lineup">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.25"/><path d="M5.5 20c.6-3.6 3.3-5.75 6.5-5.75S17.9 16.4 18.5 20"/></svg>
    <span class="tab-label">Lineup</span>
  </a>
</nav>

<script>
(function () {
  var TABS = ['today', 'weekend', 'legs', 'record', 'lineup'];
  var panels = {};
  var links = {};
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  for (var i = 0; i < TABS.length; i++) {
    panels[TABS[i]] = document.getElementById('panel-' + TABS[i]);
  }
  var anchors = document.querySelectorAll('.tab-link');
  for (var j = 0; j < anchors.length; j++) {
    links[anchors[j].getAttribute('data-tab')] = anchors[j];
  }

  function currentTab() {
    var id = (location.hash || '#today').slice(1);
    return TABS.indexOf(id) === -1 ? 'today' : id;
  }

  function show(id) {
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      var panel = panels[t];
      var link = links[t];
      var active = t === id;
      if (panel) panel.classList.toggle('is-active', active);
      if (link) {
        if (active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
    }
  }

  function activate() {
    show(currentTab());
    // Panels are id="panel-*" so the #today-style hash never matches an
    // element (no native anchor jump). Still reset to the top on every tab
    // change and after first paint, belt and braces.
    window.scrollTo(0, 0);
  }

  // Legs tab: market filter chips (the whole leg bank shows without JS).
  var chips = document.querySelectorAll('.leg-chip');
  function filterLegs(cat) {
    for (var c = 0; c < chips.length; c++) {
      chips[c].classList.toggle('is-on', chips[c].getAttribute('data-cat') === cat);
    }
    var groups = document.querySelectorAll('.leg-group.by-game');
    for (var g = 0; g < groups.length; g++) {
      var legs = groups[g].querySelectorAll('.leg');
      var shown = 0;
      for (var l = 0; l < legs.length; l++) {
        var hide = cat !== 'all' && legs[l].getAttribute('data-cat') !== cat;
        legs[l].classList.toggle('is-hidden', hide);
        if (!hide) shown++;
      }
      groups[g].classList.toggle('is-empty', shown === 0);
    }
  }
  for (var k = 0; k < chips.length; k++) {
    chips[k].addEventListener('click', function () { filterLegs(this.getAttribute('data-cat')); });
  }

  window.addEventListener('hashchange', activate);
  if (!location.hash) {
    history.replaceState(null, '', '#today');
  }
  activate();
  window.addEventListener('load', activate);
  requestAnimationFrame(function () {
    requestAnimationFrame(activate);
  });
})();
</script>
</body>
</html>
