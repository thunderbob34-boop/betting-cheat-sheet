<style>
/*
  Page contract: see templates/CONTRACT.md. This file owns ALL styling, layout,
  the tab bar, the app-install tags, and the page scripts. src/build.py only
  ever emits the plain fragment HTML documented there and string-replaces it
  into the placeholder tokens below -- it never emits style= (except the
  stop-loss fill width) or <script>.

  Look: "night game glass" -- soft stadium-light color fields drifting behind
  frosted glass cards, rounded Apple type, one floating glass tab bar.
*/

/* ---------- design tokens ---------- */
:root {
  color-scheme: dark;
  --base: #070b1a;
  --glow-blue: #2f7bff;
  --glow-coral: #ff5e8a;
  --glow-mint: #1ed6a0;
  --glow-amber: #ffb547;

  --glass: rgba(255, 255, 255, 0.075);
  --glass-strong: rgba(255, 255, 255, 0.12);
  --glass-edge: rgba(255, 255, 255, 0.16);
  --glass-shine: rgba(255, 255, 255, 0.22);
  --glass-shadow: 0 12px 34px rgba(0, 0, 0, 0.38);
  --blur: saturate(185%) blur(26px);

  --text: #f4f6ff;
  --text-dim: rgba(244, 246, 255, 0.74);
  --text-faint: rgba(244, 246, 255, 0.54);

  --accent: #7fb0ff;
  --good: #3ee8b5;
  --good-bg: rgba(30, 214, 160, 0.18);
  --fair: #9fc0ff;
  --fair-bg: rgba(127, 176, 255, 0.16);
  --bad: #ff8aa8;
  --bad-bg: rgba(255, 94, 138, 0.18);
  --gold: #ffcf7a;
  --gold-bg: rgba(255, 181, 71, 0.18);

  --tier-easy: var(--good);
  --tier-fun: #8fb4ff;
  --tier-fun2: #ff9fb8;
  --tier-lottery: var(--gold);

  --display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --r-card: 26px;
  --r-inner: 18px;
  --tabbar-h: 64px;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --base: #eef1fa;
    --glass: rgba(255, 255, 255, 0.52);
    --glass-strong: rgba(255, 255, 255, 0.72);
    --glass-edge: rgba(255, 255, 255, 0.85);
    --glass-shine: rgba(255, 255, 255, 0.95);
    --glass-shadow: 0 12px 32px rgba(40, 60, 120, 0.14);

    --text: #0e1430;
    --text-dim: rgba(14, 20, 48, 0.72);
    --text-faint: rgba(14, 20, 48, 0.52);

    --accent: #2563eb;
    --good: #0a9b72;
    --good-bg: rgba(30, 214, 160, 0.2);
    --fair: #2d5fd8;
    --fair-bg: rgba(47, 123, 255, 0.13);
    --bad: #d6335f;
    --bad-bg: rgba(255, 94, 138, 0.16);
    --gold: #a86a00;
    --gold-bg: rgba(255, 181, 71, 0.22);

    --tier-fun: #2d5fd8;
    --tier-fun2: #d6335f;
  }
}

/* ---------- reset + base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--base); }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: transparent;
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
}
h1, h2, h3 { font-family: var(--display); font-weight: 800; color: var(--text); margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; }
b { font-weight: 800; }

a:focus-visible, button:focus-visible, summary:focus-visible, .check input:focus-visible + .box {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- the stadium-light backdrop ---------- */
.aurora {
  position: fixed;
  inset: -20vmax;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 18% 12%, color-mix(in srgb, var(--glow-blue) 75%, transparent), transparent 70%),
    radial-gradient(34vmax 34vmax at 92% 28%, color-mix(in srgb, var(--glow-coral) 60%, transparent), transparent 70%),
    radial-gradient(40vmax 40vmax at 30% 82%, color-mix(in srgb, var(--glow-mint) 52%, transparent), transparent 70%),
    radial-gradient(30vmax 30vmax at 88% 90%, color-mix(in srgb, var(--glow-amber) 45%, transparent), transparent 70%);
  filter: blur(8px);
  animation: drift 26s ease-in-out infinite alternate;
}
@media (prefers-color-scheme: light) {
  .aurora { opacity: 0.55; }
}
@keyframes drift {
  from { transform: translate3d(0, 0, 0) rotate(0deg); }
  to { transform: translate3d(-3vmax, 2vmax, 0) rotate(8deg); }
}

/* ---------- glass, one recipe for every card ---------- */
.glass, .bet, .budget, .stat, .slot-row, .leg, .more, .empty-state, .stoploss,
.card-record, .last-weekend, .leg-group.by-game, .sample-banner {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-shine), var(--glass-shadow);
  border-radius: var(--r-card);
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(12px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 10px calc(18px + env(safe-area-inset-left));
  background: linear-gradient(to bottom, color-mix(in srgb, var(--base) 88%, transparent), color-mix(in srgb, var(--base) 40%, transparent));
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand {
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: -0.03em;
  background: linear-gradient(100deg, var(--text) 30%, var(--glow-mint) 65%, var(--glow-blue));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.refresh-btn {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 1px solid var(--glass-edge);
  background: var(--glass-strong);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 var(--glass-shine);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s cubic-bezier(.3, 1.6, .5, 1);
}
.refresh-btn:active { transform: scale(0.9) rotate(-40deg); }
.topbar-meta { display: flex; flex-wrap: wrap; margin: 2px 0 0; font-size: 0.8rem; color: var(--text-faint); }
.topbar-meta .next::before { content: "\00b7"; margin: 0 6px; }

.sample-banner {
  margin: 10px 18px 0;
  padding: 10px 14px;
  color: var(--gold);
  font-weight: 800;
  font-size: 0.85rem;
  text-align: center;
}

/* ---------- panels + tab switching ---------- */
main.panels {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  padding: 10px calc(16px + env(safe-area-inset-right)) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 40px) calc(16px + env(safe-area-inset-left));
}
.panel { display: flex; flex-direction: column; gap: 14px; }
html.js .panel { display: none; }
html.js .panel.is-active { display: flex; flex: 1 1 auto; }

/* cards float up when a tab opens */
html.js .panel.is-active > * { animation: rise 0.55s cubic-bezier(.2, .9, .25, 1) both; }
html.js .panel.is-active > *:nth-child(2) { animation-delay: 0.05s; }
html.js .panel.is-active > *:nth-child(3) { animation-delay: 0.1s; }
html.js .panel.is-active > *:nth-child(4) { animation-delay: 0.15s; }
html.js .panel.is-active > *:nth-child(n+5) { animation-delay: 0.2s; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to { opacity: 1; transform: none; }
}

/* ---------- floating glass tab bar ---------- */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  gap: 2px;
  width: min(440px, calc(100% - 24px));
  height: var(--tabbar-h);
  padding: 6px;
  border-radius: 999px;
  background: var(--glass-strong);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-shine), 0 16px 40px rgba(0, 0, 0, 0.35);
}
.tab-link {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 999px;
  color: var(--text-faint);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.25s ease, color 0.25s ease, transform 0.25s cubic-bezier(.3, 1.6, .5, 1);
}
.tab-link:active { transform: scale(0.92); }
.tab-icon { display: block; }
.tab-label { font-family: var(--display); font-size: 0.7rem; font-weight: 800; }
.tab-link[aria-current="page"] {
  color: var(--text);
  background: linear-gradient(135deg, color-mix(in srgb, var(--glow-blue) 55%, transparent), color-mix(in srgb, var(--glow-mint) 45%, transparent));
  box-shadow: inset 0 1px 0 var(--glass-shine);
}

/* ---------- headings ---------- */
.slot-head { padding: 8px 4px 0; }
.slot-title { font-size: 1.55rem; font-weight: 900; }
.slot-sub { font-size: 0.9rem; color: var(--text-faint); margin-top: 2px; }
.eyebrow {
  font-family: var(--display);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.tiny { font-size: 0.8rem; color: var(--text-faint); margin-top: 6px; }

/* ---------- today's plan (the checklist) ---------- */
.plan { padding: 18px 16px 10px; }
.plan-title { font-size: 1.6rem; font-weight: 900; margin: 2px 0 10px; }
.checklist { display: flex; flex-direction: column; }
.checklist li + li { border-top: 1px solid var(--glass-edge); }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 12px 2px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border-radius: 50%;
  border: 2px solid var(--text-faint);
  display: grid;
  place-items: center;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.check .box::after {
  content: "";
  width: 7px;
  height: 13px;
  border: solid #fff;
  border-width: 0 3px 3px 0;
  transform: rotate(45deg) scale(0);
  margin-top: -3px;
  transition: transform 0.25s cubic-bezier(.3, 1.8, .5, 1);
}
.check input:checked + .box {
  background: linear-gradient(135deg, var(--glow-mint), var(--glow-blue));
  border-color: transparent;
  animation: pop 0.4s cubic-bezier(.3, 1.8, .5, 1);
}
.check input:checked + .box::after { transform: rotate(45deg) scale(1); }
.check input:checked ~ .check-body { opacity: 0.45; }
.check input:checked ~ .check-body .check-text { text-decoration: line-through; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.25); } 100% { transform: scale(1); } }
.check-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: opacity 0.2s ease; }
.check-where { font-family: var(--display); font-size: 0.78rem; font-weight: 800; color: var(--accent); letter-spacing: 0.02em; }
.check-text { font-size: 1.02rem; font-weight: 700; line-height: 1.3; }
.check-sub { font-size: 0.86rem; color: var(--text-dim); }
.check-lines { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.check-lines span { font-size: 0.92rem; color: var(--text-dim); font-weight: 600; }
.check-lines span::before { content: "\2022"; margin-right: 7px; color: var(--accent); }

/* ---------- budget ---------- */
.budget { padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.budget-amount { font-family: var(--display); font-size: 2rem; font-weight: 900; letter-spacing: -0.02em; }
.budget-label { font-size: 1rem; color: var(--text-dim); font-weight: 600; }
.budget-why { flex-basis: 100%; font-size: 0.86rem; color: var(--text-faint); }

/* ---------- result badges + money ---------- */
.result-badge {
  font-family: var(--display);
  font-size: 0.78rem;
  font-weight: 800;
  padding: 4px 11px;
  border-radius: 999px;
  white-space: nowrap;
}
.result-badge.won { color: var(--good); background: var(--good-bg); }
.result-badge.lost { color: var(--bad); background: var(--bad-bg); }
.result-badge.push, .result-badge.void { color: var(--text-dim); background: var(--glass-strong); }
.result-badge.open { color: var(--fair); background: var(--fair-bg); }
.money, .edge { font-variant-numeric: tabular-nums; font-weight: 800; }
.money.positive, .edge.positive { color: var(--good); }
.money.negative, .edge.negative { color: var(--bad); }

.empty-state { padding: 26px 20px; text-align: center; }
.empty-title { font-family: var(--display); font-size: 1.2rem; font-weight: 900; }
.empty-sub { color: var(--text-dim); margin-top: 4px; }

/* ---------- bet cards ---------- */
.bet { position: relative; overflow: hidden; padding: 16px 16px 12px; }
.bet::before {
  content: "";
  position: absolute;
  inset: -40% 55% 55% -40%;
  background: radial-gradient(closest-side, var(--tier-color, var(--good)), transparent);
  opacity: 0.35;
  pointer-events: none;
}
.bet.tier-easy { --tier-color: var(--tier-easy); }
.bet.tier-fun { --tier-color: var(--tier-fun); }
.bet.tier-fun2 { --tier-color: var(--tier-fun2); }
.bet.tier-lottery { --tier-color: var(--tier-lottery); }
.bet-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.tier-badge {
  font-family: var(--display);
  font-size: 0.8rem;
  font-weight: 900;
  padding: 5px 12px;
  border-radius: 999px;
  color: var(--tier-color);
  background: color-mix(in srgb, var(--tier-color) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--tier-color) 35%, transparent);
}
.bet-title { font-size: 1.28rem; font-weight: 900; line-height: 1.2; margin-bottom: 8px; }
.bet-money { font-size: 1.05rem; color: var(--text-dim); }
.bet-money b { font-family: var(--display); font-size: 1.25rem; color: var(--text); }
.bet-chance { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-weight: 600; }
.bet-when { margin-top: 8px; font-size: 0.86rem; color: var(--text-faint); }
.bet-when .odds { font-weight: 800; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.reason-summary { margin-top: 10px; font-size: 0.98rem; color: var(--text-dim); line-height: 1.45; }

.value-tag {
  font-family: var(--display);
  font-size: 0.8rem;
  font-weight: 900;
  padding: 4px 11px;
  border-radius: 999px;
  white-space: nowrap;
}
.value-tag.good { color: var(--good); background: var(--good-bg); }
.value-tag.fair { color: var(--fair); background: var(--fair-bg); }
.value-tag.bad { color: var(--bad); background: var(--bad-bg); }
.value-tag.long { color: var(--gold); background: var(--gold-bg); }

.reconstructed-tag {
  font-family: var(--display);
  font-size: 0.72rem;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 999px;
  color: var(--gold);
  background: var(--gold-bg);
}

/* the numbers, behind the tap */
.reason-detail { margin-top: 12px; border-top: 1px solid var(--glass-edge); padding-top: 4px; }
.reason-detail summary, .more summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--display);
  font-weight: 800;
  -webkit-tap-highlight-color: transparent;
}
.reason-detail summary { padding: 8px 2px; font-size: 0.9rem; color: var(--accent); }
.reason-detail summary::-webkit-details-marker, .more summary::-webkit-details-marker,
.leg summary::-webkit-details-marker, .player summary::-webkit-details-marker { display: none; }
.reason-detail summary::after, .more summary::after {
  content: "";
  width: 8px;
  height: 8px;
  border: solid currentColor;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  transition: transform 0.25s ease;
  margin-right: 4px;
}
.reason-detail[open] summary::after, .more[open] summary::after { transform: rotate(-135deg); }
.reason-detail .reason { font-size: 0.92rem; color: var(--text-dim); margin: 8px 0; }
.reason-detail .prob-source, .reason-detail .verify { font-size: 0.8rem; color: var(--text-faint); margin-top: 6px; }

.prob-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.prob {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 12px;
  background: var(--glass-strong);
  font-size: 0.86rem;
  font-variant-numeric: tabular-nums;
}
.prob .k { font-size: 0.72rem; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.leg-list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.leg-list li { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; color: var(--text-dim); }
.leg-list .leg-prob { font-variant-numeric: tabular-nums; color: var(--text-faint); }
.leg-list .leg-prob.reconstructed::after { content: " est."; font-size: 0.75em; }

/* ---------- collapsible sections ---------- */
.more { padding: 0; }
.more summary { padding: 14px 18px; font-size: 1rem; }
.more > *:not(summary) { padding: 0 18px 16px; }
.more ul { display: flex; flex-direction: column; gap: 10px; }
.more li { font-size: 0.92rem; color: var(--text-dim); }
.more .roster li { color: var(--text); }
.more-body { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; color: var(--text-dim); }
.avoid-item, .boost-item { padding: 10px 0; border-top: 1px solid var(--glass-edge); }
.avoid-item:first-of-type, .boost-item:first-of-type { border-top: 0; }
.avoid-sel { font-weight: 800; }
.avoid-why, .boost-desc { font-size: 0.9rem; color: var(--text-dim); margin-top: 2px; }
.boost-verdict { font-family: var(--display); font-weight: 800; font-size: 0.8rem; color: var(--text-faint); }
.boost-item.fits .boost-verdict { color: var(--good); }

/* ---------- weekend ---------- */
.stoploss { padding: 16px 18px; }
.stoploss-bar { height: 12px; border-radius: 999px; background: var(--glass-strong); overflow: hidden; }
.stoploss-used { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--glow-amber), var(--glow-coral)); }
.stoploss-text { margin-top: 10px; font-size: 0.95rem; color: var(--text-dim); font-weight: 600; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-grid .stat:nth-child(3):last-child { grid-column: 1 / -1; }
.stat { padding: 14px 16px; border-radius: 22px; }
.stat .label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-faint); margin-bottom: 2px; }
.stat .value { font-family: var(--display); font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat .value.positive { color: var(--good); }
.stat .value.negative { color: var(--bad); }

.slot-row { padding: 14px 16px; }
.slot-row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.slot-name { font-family: var(--display); font-weight: 900; font-size: 1.1rem; }
.slot-date { color: var(--text-faint); font-size: 0.88rem; }
.slot-status {
  margin-left: auto;
  font-family: var(--display);
  font-size: 0.75rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--glass-strong);
  color: var(--text-dim);
}
.slot-row.published .slot-status { color: var(--fair); background: var(--fair-bg); }
.slot-row.graded .slot-status { color: var(--good); background: var(--good-bg); }
.slot-row.skipped, .slot-row.future { opacity: 0.6; }
.slot-bets { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.slot-bet { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.92rem; }
.slot-bet-tier { font-family: var(--display); font-weight: 800; font-size: 0.75rem; color: var(--text-faint); min-width: 44px; }
.slot-bet-sel { flex: 1 1 150px; min-width: 0; font-weight: 700; }
.slot-bet-line { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 0.86rem; }

/* ---------- legs ---------- */
.leg-group { display: flex; flex-direction: column; gap: 8px; }
.leg-group.best-value, .leg-group.by-game { padding: 14px 12px; }
.leg-group-title {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 8px;
  padding: 0 6px 4px;
  font-size: 1.1rem;
  font-weight: 900;
}
.leg-group-title .kickoff { font-family: var(--body); font-size: 0.82rem; font-weight: 600; color: var(--text-faint); }
.leg { padding: 0; border-radius: var(--r-inner); background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--glass-shine); }
.leg summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-tap-highlight-color: transparent; }
.leg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.leg-sel { font-weight: 800; }
.leg-head .odds { flex: 0 0 auto; font-family: var(--display); font-weight: 900; font-variant-numeric: tabular-nums; }
.leg-game { font-size: 0.82rem; color: var(--text-faint); }
.leg-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 0.9rem; color: var(--text-dim); }
.leg-more { padding: 0 14px 12px; }
.leg-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 0.86rem; }
.leg-meta .market { font-family: var(--display); font-weight: 800; font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.leg-reason { font-size: 0.88rem; color: var(--text-dim); }
.chip {
  display: inline-block;
  margin-left: 4px;
  font-family: var(--display);
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--glass-strong);
  color: var(--text-dim);
  vertical-align: middle;
}
.chip.warn { color: var(--bad); background: var(--bad-bg); }
.leg-filter { display: none; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.leg-filter::-webkit-scrollbar { display: none; }
.js .leg-filter { display: flex; }
.leg-chip {
  flex: 0 0 auto;
  font-family: var(--display);
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text-dim);
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  border-radius: 999px;
  padding: 8px 15px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(.3, 1.6, .5, 1);
}
.leg-chip:active { transform: scale(0.94); }
.leg-chip.is-on { color: #fff; background: linear-gradient(135deg, var(--glow-blue), var(--glow-mint)); border-color: transparent; }
.by-game.is-empty, .by-game .leg.is-hidden { display: none; }

/* ---------- lineups ---------- */
.league { padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.league-team { font-size: 1.45rem; font-weight: 900; margin-top: -6px; }
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 14px 16px; border-radius: var(--r-inner); }
.verdict.good { background: var(--good-bg); }
.verdict.fair { background: var(--fair-bg); }
.verdict.bad { background: var(--bad-bg); }
.verdict-word { font-family: var(--display); font-size: 1.5rem; font-weight: 900; }
.verdict.good .verdict-word { color: var(--good); }
.verdict.fair .verdict-word { color: var(--fair); }
.verdict.bad .verdict-word { color: var(--bad); }
.verdict-vs { font-weight: 700; }
.verdict-small { flex-basis: 100%; font-size: 0.84rem; color: var(--text-dim); }
.todo-box { padding: 14px 16px; border-radius: var(--r-inner); background: linear-gradient(135deg, color-mix(in srgb, var(--glow-blue) 30%, transparent), color-mix(in srgb, var(--glow-mint) 22%, transparent)); border: 1px solid var(--glass-edge); }
.todo-box.soft { background: var(--glass-strong); }
.todo-box.done { background: var(--good-bg); }
.box-title { font-family: var(--display); font-weight: 900; font-size: 1rem; }
.todo-box ul { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.todo-box li { font-size: 1rem; font-weight: 600; }
.todo-box .why { display: block; font-size: 0.86rem; font-weight: 500; color: var(--text-dim); }
.list-title { font-family: var(--display); font-weight: 900; font-size: 0.95rem; color: var(--text-faint); margin: 4px 2px -4px; }
.roster { display: flex; flex-direction: column; gap: 6px; }
.player { border-radius: 16px; background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--glass-shine); }
.player summary, .player.empty { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 11px 14px; -webkit-tap-highlight-color: transparent; }
.player.empty { cursor: default; border: 1px dashed var(--glass-edge); background: transparent; }
.slot {
  flex: 0 0 46px;
  text-align: center;
  font-family: var(--display);
  font-size: 0.78rem;
  font-weight: 900;
  padding: 4px 0;
  border-radius: 999px;
  color: var(--accent);
  background: var(--fair-bg);
}
.pname { flex: 1 1 auto; min-width: 0; font-weight: 800; }
.pmeta { font-size: 0.8rem; font-weight: 600; color: var(--text-faint); margin-left: 2px; }
.ppts { flex: 0 0 auto; font-family: var(--display); font-weight: 900; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.player-more { padding: 0 14px 12px 72px; }
.player-note { font-size: 0.9rem; color: var(--text-dim); }
.fx-error { color: var(--bad); font-weight: 600; margin-top: 6px; }

/* ---------- record ---------- */
.alltime-line { font-size: 0.9rem; color: var(--text-dim); padding: 0 4px; }
.card-record, .last-weekend { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card-record h3, .last-weekend h3 { font-size: 1.15rem; font-weight: 900; }
.card-record-note, .record-note { font-size: 0.86rem; color: var(--text-faint); }
.last-weekend .slot-row { background: var(--glass-strong); box-shadow: none; border-radius: var(--r-inner); }

/* ---------- motion off when the phone asks ---------- */
@media (prefers-reduced-motion: reduce) {
  .aurora, html.js .panel.is-active > *, .check input:checked + .box { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Cheat Sheet</h1>
    <button type="button" class="refresh-btn" onclick="location.reload()" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.66-5.66L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.66 5.66L4 16"/><path d="M4 20v-4h4"/></svg>
    </button>
  </div>
  <p class="topbar-meta"><span class="updated">{{UPDATED_AT}}</span><span class="next">{{NEXT_UPDATE}}</span></p>
</header>

{{SAMPLE_BANNER}}

<main class="panels">
  <!-- ids are panel-*, NOT the bare tab names: if an element's id matched the
       #today/#weekend/... hash, the browser would anchor-jump to it on launch
       (start_url ends in #today) and slide the top of the card under the
       sticky header. No element matches the hash, so there's nothing to jump to. -->
  <section class="panel is-active" id="panel-today">{{TODAY}}</section>
  <section class="panel" id="panel-weekend">{{WEEKEND}}</section>
  <section class="panel" id="panel-legs">{{LEGS}}</section>
  <section class="panel" id="panel-record">{{RECORD}}</section>
  <section class="panel" id="panel-lineup">{{LINEUP}}</section>
</main>

<nav class="tabbar" aria-label="Sections">
  <a href="#today" class="tab-link" data-tab="today" aria-current="page">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><circle cx="12" cy="12" r="3.6"/></svg>
    <span class="tab-label">Today</span>
  </a>
  <a href="#weekend" class="tab-link" data-tab="weekend">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.75h17"/><path d="M8 3v4M16 3v4"/></svg>
    <span class="tab-label">Weekend</span>
  </a>
  <a href="#legs" class="tab-link" data-tab="legs">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 3.75 8.25 12 13l8.25-4.75Z"/><path d="M3.75 12 12 16.75 20.25 12"/><path d="M3.75 15.75 12 20.5l8.25-4.75"/></svg>
    <span class="tab-label">Legs</span>
  </a>
  <a href="#record" class="tab-link" data-tab="record">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 20V11M9.5 20V4.5M14.5 20v-8M19.5 20v-5"/></svg>
    <span class="tab-label">Record</span>
  </a>
  <a href="#lineup" class="tab-link" data-tab="lineup">
    <svg class="tab-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.25"/><path d="M5.5 20c.6-3.6 3.3-5.75 6.5-5.75S17.9 16.4 18.5 20"/></svg>
    <span class="tab-label">Lineup</span>
  </a>
</nav>

<script>
(function () {
  var TABS = ['today', 'weekend', 'legs', 'record', 'lineup'];
  var panels = {};
  var links = {};
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  for (var i = 0; i < TABS.length; i++) {
    panels[TABS[i]] = document.getElementById('panel-' + TABS[i]);
  }
  var anchors = document.querySelectorAll('.tab-link');
  for (var j = 0; j < anchors.length; j++) {
    links[anchors[j].getAttribute('data-tab')] = anchors[j];
  }

  function currentTab() {
    var id = (location.hash || '#today').slice(1);
    return TABS.indexOf(id) === -1 ? 'today' : id;
  }

  function show(id) {
    for (var i = 0; i < TABS.length; i++) {
      var t = TABS[i];
      var panel = panels[t];
      var link = links[t];
      var active = t === id;
      if (panel) panel.classList.toggle('is-active', active);
      if (link) {
        if (active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
    }
  }

  function activate() {
    show(currentTab());
    // Panels are id="panel-*" so the #today-style hash never matches an
    // element (no native anchor jump). Still reset to the top on every tab
    // change and after first paint, belt and braces.
    window.scrollTo(0, 0);
  }

  // Legs tab: market filter chips (the whole leg bank shows without JS).
  var chips = document.querySelectorAll('.leg-chip');
  function filterLegs(cat) {
    for (var c = 0; c < chips.length; c++) {
      chips[c].classList.toggle('is-on', chips[c].getAttribute('data-cat') === cat);
    }
    var groups = document.querySelectorAll('.leg-group.by-game');
    for (var g = 0; g < groups.length; g++) {
      var legs = groups[g].querySelectorAll('.leg');
      var shown = 0;
      for (var l = 0; l < legs.length; l++) {
        var hide = cat !== 'all' && legs[l].getAttribute('data-cat') !== cat;
        legs[l].classList.toggle('is-hidden', hide);
        if (!hide) shown++;
      }
      groups[g].classList.toggle('is-empty', shown === 0);
    }
  }
  for (var k = 0; k < chips.length; k++) {
    chips[k].addEventListener('click', function () { filterLegs(this.getAttribute('data-cat')); });
  }

  // Today's plan: tick boxes remember themselves on this phone only.
  var boxes = document.querySelectorAll('.check input[data-key]');
  for (var b = 0; b < boxes.length; b++) {
    (function (box) {
      var key = 'plan:' + box.getAttribute('data-key');
      try { box.checked = localStorage.getItem(key) === '1'; } catch (e) {}
      box.addEventListener('change', function () {
        try { if (box.checked) localStorage.setItem(key, '1'); else localStorage.removeItem(key); } catch (e) {}
      });
    })(boxes[b]);
  }

  window.addEventListener('hashchange', activate);
  if (!location.hash) {
    history.replaceState(null, '', '#today');
  }
  activate();
  window.addEventListener('load', activate);
  requestAnimationFrame(function () {
    requestAnimationFrame(activate);
  });
})();
</script>
</body>
</html>
